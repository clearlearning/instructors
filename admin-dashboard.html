<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor Portal Staff Dashboard | CLEAR Learning</title>
<link rel="icon" type="image/png" href="https://assets-002.noviams.com/novi-file-uploads/clear/structure/clearlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --burgundy:#64092C; --burgundy-dk:#4A0620; --gold:#DDA838; --gold-lt:#F8EDD3;
  --charcoal:#484848; --ink:#2B2B2B; --blue:#084D78; --blue-lt:#E2EDF4;
  --bg:#F3F3F5; --surface:#FFFFFF; --line:#DEDCE0; --muted:#6E6B70;
  --avail:#1F6B3F; --avail-lt:#E3F1E8; --notavail:#5A5A5A; --na:#A9A6AB; --warn:#9A5B00;
  --radius-lg:10px; --radius-sm:6px;
  font-family:"Open Sans","Trebuchet MS",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.top{background:var(--burgundy);color:#fff}
.top-in{max-width:1400px;margin:0 auto;padding:18px 24px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;opacity:.8;font-weight:600}
.brand h1{margin:2px 0 14px;font-size:24px;font-weight:800}
.who{text-align:right;font-size:12px;padding-bottom:14px}
.who strong{display:block;font-size:14px}
.who a{color:#fff;opacity:.85}
.tabs{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#fff;opacity:.75;padding:9px 15px 11px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--bg);color:var(--burgundy);opacity:1}
main{max-width:1400px;margin:0 auto;padding:22px 24px 60px}

h2{font-size:20px;margin:0 0 4px;color:var(--burgundy)}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;max-width:80ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}
.bar label{font-weight:600;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=email],input[type=date],input[type=search],textarea{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
textarea{width:100%;resize:vertical}

.btn{border:0;border-radius:var(--radius-sm);padding:8px 14px;font-weight:700;cursor:pointer;background:var(--burgundy);color:#fff;white-space:nowrap}
.btn:hover{background:var(--burgundy-dk)}
.btn:disabled{background:#CFCBD0;cursor:default}
.btn.ghost{background:#fff;color:var(--burgundy);border:1px solid var(--burgundy)}
.btn.ghost:hover{background:#FAF4F6}
.btn.small{padding:5px 10px;font-size:12px}
.btn.link{background:none;color:var(--blue);padding:2px 4px;font-weight:600;text-decoration:underline}
.btn.danger{background:#fff;color:#9B1C1C;border:1px solid #D9B3B3}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:12px;background:#ECEAEE;color:var(--charcoal);text-transform:capitalize}
.pill.open{background:var(--avail-lt);color:var(--avail)}
.pill.draft{background:var(--gold-lt);color:#7A5410}
.pill.closed{background:#ECEAEE}
.pill.archived{background:#F4F4F4;color:var(--muted)}
.facts{font-size:12px;color:var(--muted)}
.stat-row{display:flex;gap:22px;margin:12px 0}
.stat b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:6px;background:#E4E2E6;border-radius:3px;overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--avail)}
.meter.gold span{background:var(--gold)}
.notice{background:var(--gold-lt);border-left:4px solid var(--gold);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px}
.err{background:#FBE9EC;border-left:4px solid var(--burgundy);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius-lg);padding:30px;text-align:center;color:var(--charcoal)}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid #EEECEF;text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:#FAF7F8;z-index:2;font-size:12px;color:var(--charcoal);border-bottom:1px solid var(--line)}
tbody tr:hover td{background:#FCFBFC}
.mx th.inst{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:150px;padding:8px 4px;text-align:left;font-weight:600;min-width:34px}
.mx th.inst a{color:inherit;text-decoration:none}
.mx th.inst a:hover{text-decoration:underline}
.mx td.first,.mx th.first{position:sticky;left:0;background:#fff;z-index:1;min-width:300px;max-width:360px;border-right:1px solid var(--line)}
.mx thead th.first{z-index:3;background:#FAF7F8}
.mx tr.whole td{background:#FAF7F8;font-weight:700}
.mx tr.whole td.first{background:#FAF7F8}
.cell{width:34px;height:28px;border:0;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;background:#F2F1F3;color:var(--muted)}
.cell.A{background:var(--avail);color:#fff}
.cell.N{background:#DAD8DC;color:var(--notavail)}
.cell.NA{background:#EFEEF0;color:var(--na)}
.cell.inh{opacity:.55}
.cell:hover{outline:2px solid var(--gold)}
td.num{text-align:center;font-weight:700}
.s-date{font-size:12px;color:var(--muted);font-weight:400}

/* selection */
.slot{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:20px 0;border-top:2px solid #C9C4CA}
.slot:first-child{border-top:0}
.slot:first-of-type{border-top:0}
.slot .meta{font-weight:800;font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--avail);background:var(--avail-lt)}
.chip .load{color:var(--muted);margin-left:4px}
.chip.na-maybe{border-style:dashed}
.picked{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FAF7F8;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px}
.pick.Confirmed{background:var(--gold-lt);border-color:#E8CF94}
.pick .nm{font-weight:700;min-width:150px}
.pick select{padding:3px 6px;font-size:12px}
.warn{color:var(--warn);font-size:12px;font-weight:600}
.note{border-left:3px solid var(--gold);padding:4px 10px;margin:8px 0;font-size:13px}
.note small{color:var(--muted);display:block}

/* editor */
dialog{border:0;border-radius:var(--radius-lg);padding:0;max-width:980px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(40,10,20,.25)}
dialog::backdrop{background:rgba(40,20,28,.45)}
.dlg-head{background:var(--burgundy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{margin:0;font-size:17px}
.dlg-head button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.dlg-body{padding:18px 20px;max-height:70vh;overflow:auto}
.dlg-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f label{font-weight:600;font-size:12px;color:var(--charcoal)}
.form .span2{grid-column:span 2}.form .span4{grid-column:1 / -1}
.sess-tbl input{width:100%;padding:5px 7px}
.menu{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;display:flex;flex-direction:column;min-width:170px}
.menu .hd{font-size:11px;color:var(--muted);padding:4px 8px;max-width:220px}
.menu button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.menu button:hover{background:#F5F3F6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
.toast.show{opacity:1}
.log-row{display:grid;grid-template-columns:150px 220px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #EEECEF;font-size:13px}
.log-row .t{color:var(--muted)}
.ph{margin:-18px -20px 14px;padding:14px 20px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:#FAF7F8;border-bottom:1px solid var(--line)}
.ph h3{color:var(--burgundy);margin:0}.ph .facts{color:var(--muted)}
.tr-ncit{--tc:var(--burgundy);--tt:var(--burgundy)}.tr-blue{--tc:var(--blue);--tt:var(--blue)}.tr-gold{--tc:var(--gold);--tt:var(--burgundy-dk)}
.ph,.mx-band{border-top:6px solid var(--tc,var(--line));background:#FAF7F8}
.ph h3,.mx-band h3{color:var(--tt,var(--burgundy))!important}
.ttl{display:flex;gap:12px;align-items:center;min-width:0}
.plogo{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.plogo.sm{width:28px;height:28px;border-radius:6px}
.trk{border-left:6px solid transparent}.trk.k-ncit{border-left-color:var(--burgundy)}.trk.k-blue{border-left-color:var(--blue)}.trk.k-gold{border-left-color:var(--gold)}
.mx-band{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:10px}
.mx-band h3{margin:0}
.allrow td{background:#F4F8FB!important;color:var(--blue)}
.pill.locked{background:#FBE9EC;color:#9B1C1C;text-transform:none}
.pill.src{background:#F4F1F5;color:var(--muted);text-transform:none;font-weight:600}
.okc{color:var(--avail);font-weight:700}
.mailst{font-size:11px;color:var(--muted);white-space:nowrap}
.mailst.chg,.mailst.sched{color:var(--warn);font-weight:700}
.chipwrap{display:inline-flex;align-items:stretch}
.chipwrap .chip{border-radius:16px 0 0 16px}
.chipwrap .chip-x{border:1px solid var(--line);border-left:0;border-radius:0 16px 16px 0;padding:3px 8px;font-size:12px;text-decoration:none;color:var(--blue);background:#fff}
.chipwrap .chip-x:hover{background:var(--blue-lt)}
a.ext{font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
a.ext:hover{text-decoration:underline}
.checks{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;background:#FCFBFC}
.checks label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.mail-prev{margin-top:14px}
.mail-prev iframe{width:100%;height:440px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.mail-prev .hdr{font-size:13px;background:#FAF7F8;border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;padding:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--burgundy);color:#fff}
.ans{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin:2px 4px 2px 0;background:#F2F1F3;color:var(--muted)}
.ans.A{background:var(--avail-lt);color:var(--avail)}
.ans.N{background:#E6E4E8;color:var(--notavail)}
table.quals th.qh{font-size:11px;font-weight:600;min-width:74px;max-width:90px;text-align:center;vertical-align:bottom;white-space:normal;line-height:1.25}
table.quals th.qh .plogo{display:block;margin:0 auto 4px}
table.quals td{padding:6px 8px}
tr.grp td{background:#F4F1F5;border-top:2px solid var(--line);padding:8px 12px}
tr.grp.k-ncit td{border-left:6px solid var(--burgundy)}tr.grp.k-blue td{border-left:6px solid var(--blue)}tr.grp.k-gold td{border-left:6px solid var(--gold)}
tr.grp .ttl{gap:10px}tr.grp strong{font-size:14px}
.pgroup{background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px 16px;margin:0 0 22px}
.pgroup.k-ncit{border-left-color:var(--burgundy)}.pgroup.k-blue{border-left-color:var(--blue)}.pgroup.k-gold{border-left-color:var(--gold)}
.pgroup .pg-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pgroup .pg-h h3{margin:0;font-size:16px;color:var(--burgundy)}
.pgroup.k-blue .pg-h h3{color:var(--blue)}.pgroup.k-gold .pg-h h3{color:var(--burgundy-dk)}
.pgroup .tbl-wrap{border-radius:var(--radius-sm)}
.ibox,.fline{padding:8px 12px 10px;border-radius:8px;background:transparent}
.ibox{border:2px solid #64092C}
.fline{margin-top:10px;border:2px solid #DDA838}
.ihead,.fline .fhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.itag,.ftag{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.itag{color:#64092C}
.ftag{color:#8A6514}
.rte-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:#FAF7F8;padding:5px 6px}
.rte-bar button{border:1px solid transparent;background:none;border-radius:4px;padding:3px 9px;font-size:13px;cursor:pointer;color:var(--ink)}
.rte-bar button:hover{background:#fff;border-color:var(--line)}
.rte-bar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rte{min-height:200px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px 12px;background:#fff;line-height:1.55;font-size:14px}
.rte:focus{outline:3px solid var(--gold);outline-offset:1px}
.rte:empty::before{content:attr(data-ph);color:var(--muted)}
.rte p{margin:0 0 10px}.rte ul,.rte ol{margin:0 0 10px;padding-left:22px}
.icsbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:#FAF7F8;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;margin-top:12px}
@media (max-width:820px){.slot{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.log-row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><small>CLEAR Learning</small><h1>Instructor Portal Staff Dashboard</h1></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" data-tab="selection">Selection</button>
    <button class="tab" data-tab="programs">Programs</button>
    <button class="tab" data-tab="roster">Instructors</button>
    <button class="tab" data-tab="facilitators">Facilitators</button>
    <button class="tab" data-tab="staff">Staff</button>
    <button class="tab" data-tab="log">Activity</button>
  </nav>
</header>
<main id="main"><div class="loading">Loading dashboard…</div></main>
<iframe id="welengine" src="/welcome-emails?engine=1" title="Welcome email engine" hidden aria-hidden="true" tabindex="-1" onload="welcomeReady()"></iframe>

<dialog id="dlg"><div class="dlg-head"><h3 id="dlg-title"></h3><button onclick="closeDlg()" aria-label="Close">×</button></div><div class="dlg-body" id="dlg-body"></div><div class="dlg-foot" id="dlg-foot"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PS='__program';
const LBL={A:'Available',N:'Not available',NA:'N/A'};
const SHORT={A:'A',N:'N',NA:'–'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const U={ tab:'overview', rview:'program', iid:null, pid:null, quarter:'all', assignDraft:{}, assignDirty:new Set(), rosterDraft:null, rosterDirty:false, staffDraft:null, importPreview:null, log:null, filter:'' };
let D=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseD=d=>{const [y,m,dd]=String(d||'').split('-').map(Number);return y?new Date(y,m-1,dd):null;};
const fmtD=(d,y=true)=>{const x=parseD(d);return x?`${MONTHS[x.getMonth()]} ${x.getDate()}${y?', '+x.getFullYear():''}`:'';};
const fmtRange=(a,b)=>!a?'':(!b||a===b?fmtD(a):`${fmtD(a,false)} – ${fmtD(b)}`);
const stamp=iso=>iso?new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const titleOf=p=>p.title+(p.cohort?` (${p.cohort})`:'');
const trk=p=>['ncit','blue','gold'].includes(p.track)?'tr-'+p.track:'';
const logoImg=(p,sm)=>p.logo?`<img class="plogo${sm?' sm':''}" src="${esc(p.logo)}" alt="" onerror="this.remove()">`:'';
const trkL=p=>['ncit','blue','gold'].includes(p.track)?'trk k-'+p.track:'trk';
const isIP=p=>/person/i.test(p.format||'');
// Teaching approvals: no approvals recorded = approved for everything; Workshop Series is open to anyone approved for any workshop.
const COURSES=[['NCITB','NCIT Basic','NCIT'],['NCITS','NCIT Specialized','NCIT'],['NCITAIT','NCIT AIT','NCIT'],['NCITWS','Workshop Series','NCIT'],['NCITWDDI','Drug Diversion','NCIT'],['NCITWIRSM','Sexual Misconduct','NCIT'],['NCITWCSAP','Communications','NCIT'],['NCITWERI','Ethics','NCIT'],
  ['ELPR','ELPR','Leadership and governance'],['SRASAB','SRA: Staffing a Board','Leadership and governance'],['ACRG','ACRG','Leadership and governance'],['BCT','Board Chair Training','Leadership and governance'],['IRG','Intro to Reg. Governance','Leadership and governance']];
const DELIV={online:'Online only','in-person':'In person only',both:'Both'};
// Programs tab grouping: by program type, in this order; each group lists its programs by start date.
const PGROUPS=[{k:'NCITB',l:'NCIT Basic',logo:'NCITB',t:'ncit'},{k:'NCITS',l:'NCIT Specialized',logo:'NCITS',t:'ncit'},{k:'NCITAIT',l:'NCIT AIT',logo:'NCITAIT',t:'ncit'},
  {k:'NCITW',l:'NCIT Workshops',logo:'NCITWS',t:'ncit'},{k:'ELPR',l:'ELPR',logo:'ELPR',t:'blue'},{k:'SRASAB',l:'SRA: Staffing a Board',logo:'SRASAB',t:'blue'},
  {k:'IRG',l:'Introduction to Regulatory Governance',logo:'IRG',t:'gold'},{k:'ACRG',l:'ACRG',logo:'ACRG',t:'gold'},{k:'BCT',l:'Board Chair Training',logo:'BCT',t:'gold'},{k:'OTHER',l:'Other programs',logo:'',t:''}];
function pgroupOf(p){ const k=p.courseKey||''; if(/^NCITW/.test(k)) return 'NCITW'; return PGROUPS.some(g=>g.k===k)?k:'OTHER'; }
function elig(r,p){
  const d=r&&r.delivery, ip=/person/i.test(p.format||'')&&!/hybrid/i.test(p.format||''), hy=/hybrid/i.test(p.format||'');
  if(d==='online'&&ip) return false; if(d==='in-person'&&!ip&&!hy) return false;
  const q=(r&&r.quals)||[]; if(!q.length) return true; const k=p.courseKey; if(!k||q.includes(k)) return true; return k==='NCITWS'&&q.some(x=>/^NCITW/.test(x)); }
function sTime(p,s){ if(!s.start) return fmtD(s.date)+(s.endDate?' – '+fmtD(s.endDate):'');

const clockMin=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})\s*([AP])M$/i);return m?(+m[1]%12+(/p/i.test(m[3])?12:0))*60+ +m[2]:0;};

// One survey link per confirmed instructor per instructor-led session, plus the self-paced module links.
function kitPlan(p){
  const cfg=KIT_CFG[p.courseId]; if(!cfg) return {supported:false};
  const slots=(D.assignments[p.id]||{}).slots||{};
  const conf=k=>(slots[k]||[]).filter(e=>e.status==='Confirmed').map(e=>inst(e.iid)).filter(Boolean);
  const whole=conf(PS), ss=answerable(p).slice().sort(bySessionTime), cohort=p.cohort||p.title;
  const rows=[], missing=[], rules=(cfg.rules||[]).slice();
  ss.forEach((s,idx)=>{
    let code='', version=cfg.version||'', coh=cohort;
    if(cfg.mode==='rules'){const i=rules.findIndex(r=>r[0].test(s.title));if(i<0)return;code=rules[i][1];rules.splice(i,1);}
    else if(cfg.mode==='modules'){const m=s.title.match(/module\s*(\d+)/i);code='M'+String(m?+m[1]:idx+1).padStart(2,'0');}
    else if(cfg.mode==='order'){code='M'+String(idx+1).padStart(2,'0');}
    else if(cfg.mode==='ws'){code=wsCode(s.title);}
    else if(cfg.mode==='series'){version=seriesVersion(s.title);if(!version)return;code=wsCode(s.title);
      // Each workshop in a series has its own cohort code, e.g. 2027.03.11 NCIT W IRSM Open.
      coh=/NCIT W Series/i.test(cohort)?cohort.replace(/NCIT W Series/i,'NCIT W '+version):`${String(p.startDate||'').replace(/-/g,'.')} NCIT W ${version} Open`;}
    const people=conf(s.id).length?conf(s.id):whole, method=cfg.ipt?'IPT-ILT':'V-ILT';
    if(!people.length){missing.push(`${s.title} (${fmtD(s.date)})`);return;}
    people.forEach(r=>rows.push({type:method,module:code,version,session:s.title,date:s.date,instructor:r.name,cohort:coh,qr:!!cfg.ipt,
      url:surveyUrl(SURVEY.ilt,{course:cfg.course,version,method,module_name:code,Instructor:r.name,Cohort:coh})}));
  });
  (cfg.async||[]).forEach(code=>rows.push({type:'Async',module:code,version:cfg.version||'',session:'Self-paced module',date:'',instructor:'',cohort,qr:false,
    url:surveyUrl(SURVEY.async,{course:cfg.course,version:cfg.version||'',method:'Async',module_name:code,Cohort:cohort})}));
  const ilt=rows.filter(r=>r.type!=='Async').length;
  return {supported:true,cfg,rows,missing,ready:!missing.length&&ilt>0};
}
// Values for the welcome email tool's fields, from the program's sessions and its in-person details.
function welcomeValues(p,key){
  const warn=[], all=(p.sessions||[]).slice().sort(bySessionTime);
  const review=all.filter(s=>/program review/i.test(s.title)).pop(), wel=all.find(s=>s.allInstructors||/^\s*welcome/i.test(s.title));
  if(key==='ncitb_vt'||key==='ncits_vt'){ if(!review){warn.push('No Program Review session, so the completion due date is left blank.');return {v:{},warn};} return {v:{[key+'_due']:longD(review.date)},warn}; }
  if(key==='acrg_vt'||key==='elpr_vt'){ const px=key==='acrg_vt'?'acrg_':'elpr_vt_';
    if(!wel){warn.push('No Welcome session found, so its date, time and link are left blank.');return {v:{},warn};}
    if(!wel.zoomLink) warn.push('The Welcome session has no Zoom link yet, so the link is left blank.');
    return {v:{[px+'date']:dayLongD(wel.date),[px+'time']:`${wel.start} - ${wel.end} Eastern`,[px+'link']:wel.zoomLink||''},warn}; }
  const px=WELCOME_PREFIX[key];
  if(px){ const w=p.welcome||{}, v={};
    const dates=p.startDate===p.endDate?longD(p.startDate):(()=>{const a=parseD(p.startDate),b=parseD(p.endDate);return a&&b?`${LONGM[a.getMonth()]} ${a.getDate()} to ${LONGM[b.getMonth()]} ${b.getDate()}, ${b.getFullYear()}`:'';})();
    IPT_FIELDS.forEach(([k])=>{ let val=w[k]||''; if(k==='city'&&!val)val=p.location||''; if(k==='dates'&&!val)val=dates; v[px+k]=val; });
    const blank=IPT_FIELDS.filter(([k])=>!v[px+k]).map(f=>f[1]);
    if(blank.length) warn.push(`In-person details not entered yet: ${blank.join(', ')}. Add them under Welcome email details in the program editor.`);
    return {v,warn}; }
  return {v:{},warn};
}

function facQualRow(i,all){ const r=U.facDraft[i]; r.quals=all?FCOURSES().map(c=>c[0]):[]; if(!all) r.mods={}; U.facDirty=true; render(); }
function facQualCol(k){ const rows=U.facDraft.filter(r=>r.active!==false); const allOn=rows.every(r=>(r.quals||[]).includes(k));
  rows.forEach(r=>{ const q=new Set(r.quals||[]); if(allOn){ q.delete(k); if(r.mods) delete r.mods[k]; } else q.add(k); r.quals=COURSES.map(c=>c[0]).filter(x=>q.has(x)); }); U.facDirty=true; render(); }

function removeFac(i){
  const r=U.facDraft[i];
  if(r.id){
    const answers=Object.keys((D.fresponses||{})[r.id]||{}).length;
    const picks=D.programs.reduce((n,p)=>n+Object.values((D.assignments[p.id]||{}).fslots||{}).filter(l=>l.some(e=>e.fid===r.id)).length,0);
    const warn=answers||picks?`\n\n${r.name} has ${answers?answers+' program'+(answers>1?'s':'')+' of answers':''}${answers&&picks?' and ':''}${picks?picks+' session pick'+(picks>1?'s':''):''}. To keep that history, cancel and untick Active instead.`:'';
    if(!confirm(`Remove ${r.name||'this facilitator'}? When you save, they're deleted from the portal, along with their answers and profile.${warn}`)) return;
  }

      ${row('Phone',esc(p.phone||''))}${row('Email',p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:'')}${row('Mailing address',addr)}</tbody></table></div>
    ${isF?'':`<h3 style="margin-top:16px">Professional bio</h3><div class="card" style="padding:12px 14px">${p.bio||'<span class="facts">Not provided</span>'}</div>`}

      return `<td style="padding:3px 2px;text-align:center"><button class="cell ${v} ${inh?'inh':''}" title="${esc(r.name)}: ${v?LBL[v]:'Not answered'}${inh?' (from whole program)':''}" onclick="cellMenu(event,'${r.id}','${p.id}','${row.whole?PS:row.key}',${row.whole})">${label}</button></td>`;

  }
  h+=`</tbody></table></div>`;
  const comments=insts.map(r=>({r,c:(resp(r.id,p.id)||{}).comment,at:(resp(r.id,p.id)||{}).updatedAt,by:(resp(r.id,p.id)||{}).updatedBy})).filter(x=>x.c);

}

let menuEl=null;
function closeMenu(){ if(menuEl){menuEl.remove();menuEl=null;} }
document.addEventListener('click',e=>{ if(menuEl&&!menuEl.contains(e.target)&&!e.target.classList.contains('cell')) closeMenu(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenu(); });
function cellMenu(ev,iid,pid,key,wholeRow){
  ev.stopPropagation(); closeMenu();
  const p=prog(pid), r=inst(iid), labels=LBL;
  const what=key===PS?(wholeRow?'whole program':'entire program'):((p.sessions.find(s=>s.id===key)||{}).title||'session');
  menuEl=document.createElement('div'); menuEl.className='menu';
  menuEl.innerHTML=`<div class="hd">${esc(r.name)}, ${esc(what)}</div>`+Object.entries(labels).map(([v,l])=>`<button onclick="setCell('${iid}','${pid}','${key}','${v}')">${l}</button>`).join('')+`<button onclick="setCell('${iid}','${pid}','${key}','')">Clear${key!==PS?' (use whole-program answer)':''}</button>`;
  document.body.appendChild(menuEl);
  const b=ev.target.getBoundingClientRect();
  menuEl.style.left=Math.min(window.scrollX+b.left,window.scrollX+innerWidth-200)+'px'; menuEl.style.top=(window.scrollY+b.bottom+4)+'px';
}
async function setCell(iid,pid,key,v){
  closeMenu();
  const cur=resp(iid,pid)||{program:'',sessions:{},comment:''};
  const body={program:cur.program||'',sessions:{...(cur.sessions||{})},comment:cur.comment||''};
  if(key===PS) body.program=v; else if(v) body.sessions[key]=v; else delete body.sessions[key];
  try{ const r=await api(`admin/response/${iid}/${pid}`,{method:'PUT',body:JSON.stringify(body)});
    D.responses[iid]=D.responses[iid]||{}; D.responses[iid][pid]={...r.response}; render(); toast('Answer saved for '+inst(iid).name);}catch(e){toast(e.message);}
}
function exportMatrix(which){
  const list=which==='one'?[prog(U.pid)]:D.programs.filter(p=>p.status==='open'&&inQuarter(p));
  const insts=active();
  const out=[csvRow(['Program','Date','Session','Start','End','Time Zone','Format','Location',...insts.map(r=>r.name),'# Available','# Not Answered','Comments'])];
  for(const p of list){
    const rows=[];
    if(answerable(p).length) rows.push({key:PS,whole:true,title:`ENTIRE PROGRAM (${fmtRange(p.startDate,p.endDate)})`,date:p.startDate,start:'All dates',end:'All dates'});
    for(const u of units(p)) rows.push(u.s?{key:u.key,title:u.s.title,date:u.s.date,start:u.s.start,end:u.s.end}:{key:PS,title:`ENTIRE PROGRAM (${fmtRange(p.startDate,p.endDate)})`,date:p.startDate,start:'All dates',end:'All dates'});
    rows.forEach((row,i)=>{
      const vals=insts.map(r=>row.whole?((resp(r.id,p.id)||{}).program||''):eff(r.id,p,row.key));
      const comments=i===0?insts.map(r=>(resp(r.id,p.id)||{}).comment?`${r.name}: ${(resp(r.id,p.id)).comment}`:'').filter(Boolean).join(' | '):'';
      out.push(csvRow([titleOf(p),row.date,row.title,row.start,row.end,p.timezone,p.format,p.location,...vals.map(v=>v?LBL[v]:''),vals.filter(v=>v==='A').length,vals.filter(v=>!v).length,comments]));
    });
  }
  download(`instructor-portal-${which==='one'?prog(U.pid).title.replace(/[^\w]+/g,'-'):'open-programs'}.csv`,out.join('\r\n'));
}

async function downloadIcs(pid,iid){
  try{ const r=await fetch('/api/admin/ics/'+pid+(iid?'?iid='+iid:''),{credentials:'same-origin'});
    if(!r.ok){ let j={}; try{j=await r.json();}catch{} throw new Error(j.error||'Download failed ('+r.status+')'); }
    const m=(r.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/); const a=document.createElement('a'); a.href=URL.createObjectURL(await r.blob()); a.download=m?m[1]:'calendar.ics'; a.click();
  }catch(e){ toast(e.message); }
}
async function uploadIcs(pid,input){
  const f=input.files[0]; if(!f) return;
  try{ const ics=await f.text(); const r=await api('admin/ics/'+pid,{method:'PUT',body:JSON.stringify({ics,name:f.name})});
    Object.assign(prog(pid),{hasIcs:r.program.hasIcs,icsName:r.program.icsName,icsSource:r.program.icsSource,icsUpdatedAt:r.program.icsUpdatedAt}); render(); toast('Calendar file saved'); }catch(e){ toast(e.message); }
}
async function removeIcs(pid){
  if(!confirm('Remove the calendar file? Selection emails will build one from the session details instead.')) return;
  try{ const r=await api('admin/ics/'+pid,{method:'DELETE'}); Object.assign(prog(pid),{hasIcs:false,icsName:'',icsSource:'',icsUpdatedAt:''}); closeDlg(); render(); toast('Calendar file removed'); }catch(e){ toast(e.message); }
}

function addPick(pid,key,iid){ const d=draftOf(pid); (d[key]=d[key]||[]).push({iid,role:'Instructor',status:'Tentative'}); U.assignDirty.add(pid); render(); }
function editPick(pid,key,i,field,val){ const d=draftOf(pid); if(field==='remove') d[key].splice(i,1); else d[key][i][field]=val; U.assignDirty.add(pid); render(); }
function bulkAdd(pid){ const iid=document.getElementById('bulk-i').value; if(!iid) return; const p=prog(pid), d=draftOf(pid); let n=0;

function exportSelections(){

/* Rich text for Compose email. The portal keeps bold, italic, underline, lists and links when it sends. */
function rteCmd(c){ document.getElementById('cm-body').focus(); try{ document.execCommand('defaultParagraphSeparator',false,'p'); }catch(e){} document.execCommand(c,false,null); }
function rteLink(){
  const sel=window.getSelection(); if(!sel||sel.isCollapsed){ toast('Select the text to turn into a link first.'); return; }
  const range=sel.getRangeAt(0);
  let url=prompt('Link address (https:// or mailto:)','https://'); if(!url) return; url=url.trim();
  if(!/^(https:\/\/|mailto:)/i.test(url)){ if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(url)) url='mailto:'+url; else { toast('Links must start with https:// or mailto:'); return; } }
  sel.removeAllRanges(); sel.addRange(range); document.getElementById('cm-body').focus(); document.execCommand('createLink',false,url);
}
// Wrap loose top-level text in paragraphs so every line is styled in the email.
function rteHtml(el){
  const out=[]; let run='';
  const flush=()=>{ if(run.replace(/<br>|&nbsp;|\s/g,'')) out.push('<p>'+run+'</p>'); run=''; };
  el.childNodes.forEach(n=>{
    if(n.nodeType===1&&/^(P|DIV|UL|OL|H[1-6]|BLOCKQUOTE)$/.test(n.tagName)){ flush(); out.push(n.outerHTML); }
    else if(n.nodeType===1&&n.tagName==='BR'){ if(run) run+='<br>'; else flush(); }
    else run+=n.nodeType===3?esc(n.textContent):n.outerHTML;
  });
  flush(); return out.join('');
}

async function saveProgram(pid){
  const p=window._edit, g=id=>{const el=document.getElementById('e-'+id);return el?el.value:'';};
  ['title','cohort','quarter','format','location','timezone','startDate','endDate','deadline','status','description'].forEach(k=>p[k]=g(k));

  if(pid&&p.sessions.length<prog(pid).sessions.length&&!confirm('You removed sessions. Instructor answers for those sessions will no longer show. Save anyway?')) return;
  const id=pid||'p_'+crypto.randomUUID().replace(/-/g,'').slice(0,10);
  try{ const r=await api('admin/program/'+id,{method:'PUT',body:JSON.stringify({program:p,baseUpdatedAt:pid?prog(pid).updatedAt:undefined})});

async function delProgram(pid){ const p=prog(pid);

async function parsePackage(){

async function runPackage(){

/* ---------- Spreadsheet import ---------- */
function importDlg(){
  U.importPreview=null;
  openDlg('Import the availability spreadsheet',`<p class="sub">Choose the coordinator's workbook (the same layout as Q1_2027.xlsx, with an Availability tab). Each program becomes a draft, sessions come from the rows under its ENTIRE PROGRAM row, and instructor names from the header row are added to the Instructors list. Programs already in the dashboard with the same title and start date are skipped.</p>
    <div class="form"><div class="f span2"><label for="imp-file">Workbook</label><input type="file" id="imp-file" accept=".xlsx,.xls" onchange="parseImport()"></div><div class="f"><label for="imp-q">Quarter label</label><input id="imp-q" type="text" placeholder="Q1 2027"></div>
    <div class="f"><label for="imp-dl">Answer by (optional)</label><input id="imp-dl" type="date"></div></div><div id="imp-prev" style="margin-top:14px"></div>`,
    `<button class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn" id="imp-go" disabled onclick="runImport()">Import as drafts</button>`);
}
function cellDate(v){
  if(typeof v==='number'){ const c=XLSX.SSF.parse_date_code(v); return c?`${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`:''; }
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const s=String(v||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const d=new Date(s); return isNaN(d)?'':cellDate(d);
}
function cellTime(v){
  if(typeof v==='number'){ const mins=Math.round((v%1)*1440); let h=Math.floor(mins/60),m=mins%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
  return String(v||'').trim();
}
function rangeEnd(label,start){ // "ENTIRE PROGRAM (Jan 21-Feb 4)" -> end date
  const m=String(label).match(/\(([A-Za-z]{3})\s*(\d{1,2})\s*-\s*(?:([A-Za-z]{3})\s*)?(\d{1,2})\)/); if(!m||!start) return '';
  const y=+start.slice(0,4), sm=MONTHS.indexOf(m[1]), em=m[3]?MONTHS.indexOf(m[3]):sm; if(em<0) return '';
  const yy=em<sm?y+1:y; return `${yy}-${String(em+1).padStart(2,'0')}-${String(+m[4]).padStart(2,'0')}`;
}
async function parseImport(){
  const f=document.getElementById('imp-file').files[0]; if(!f) return;
  const prev=document.getElementById('imp-prev');
  try{
    if(!window.XLSX) throw new Error('The spreadsheet reader didn\'t load. Check your connection and reload the page.');
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const ws=wb.Sheets['Availability']||wb.Sheets[wb.SheetNames.find(n=>/avail/i.test(n))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    const hi=rows.findIndex(r=>String(r[0]).trim().toLowerCase()==='program');
    if(hi<0) throw new Error('Couldn\'t find the header row (a row starting with "Program").');
    const head=rows[hi].map(x=>String(x).trim());
    const col=n=>head.findIndex(x=>x.toLowerCase()===n);
    const C={prog:0,date:col('date'),sess:col('session'),start:col('start'),end:col('end'),tz:col('time zone'),fmt:col('format'),loc:col('location')};
    const firstInst=Math.max(C.loc,C.fmt,C.tz)+1, stop=head.findIndex((x,i)=>i>=firstInst&&/^#|comments/i.test(x));
    const instructors=head.slice(firstInst,stop<0?undefined:stop).filter(Boolean);
    const map=new Map();
    for(const r of rows.slice(hi+1)){
      const title=String(r[C.prog]||'').trim(); if(!title) continue;
      const sess=String(r[C.sess]||'').trim(), date=cellDate(r[C.date]);
      if(!map.has(title)) map.set(title,{title,format:String(r[C.fmt]||'').trim(),location:String(r[C.loc]||'').trim(),timezone:String(r[C.tz]||'').trim(),startDate:date,endDate:'',sessions:[]});
      const p=map.get(title);
      if(/^entire program/i.test(sess)){ p.startDate=date||p.startDate; p.endDate=rangeEnd(sess,p.startDate)||p.endDate; continue; }
      if(sess) p.sessions.push({title:sess,date,start:cellTime(r[C.start]),end:cellTime(r[C.end])});
    }
    const programs=[...map.values()];
    if(!programs.length) throw new Error('No program rows found under the header.');
    U.importPreview={programs,instructors};
    const q=document.getElementById('imp-q'); if(!q.value){ const m=f.name.match(/Q([1-4])[\s_-]*(\d{4})/i); if(m) q.value=`Q${m[1]} ${m[2]}`; }
    const have=new Set(D.programs.map(p=>p.title.toLowerCase()+'|'+p.startDate));
    prev.innerHTML=`<div class="tbl-wrap" style="max-height:300px"><table><thead><tr><th>Program</th><th>Dates</th><th>Format</th><th>Sessions</th><th></th></tr></thead><tbody>${programs.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(fmtRange(p.startDate,p.endDate))}</td><td>${esc(p.format)}${p.location&&p.location!=='Virtual'?', '+esc(p.location):''}</td><td>${p.sessions.length||'Whole program'}</td><td>${have.has(p.title.toLowerCase()+'|'+p.startDate)?'<span class="warn">Already here, will skip</span>':''}</td></tr>`).join('')}</tbody></table></div>
      <p class="facts" style="margin-top:10px">${instructors.length} instructor names found. ${instructors.filter(n=>!D.roster.some(r=>r.name.toLowerCase()===n.toLowerCase())).length} are new and will be added without emails.</p>`;
    document.getElementById('imp-go').disabled=false;
  }catch(e){ prev.innerHTML=`<div class="err">${esc(e.message)}</div>`; document.getElementById('imp-go').disabled=true; }
}
async function runImport(){
  const q=document.getElementById('imp-q').value.trim(), dl=document.getElementById('imp-dl').value;
  const programs=U.importPreview.programs.map(p=>({...p,quarter:q,deadline:dl}));
  try{ const r=await api('admin/import',{method:'POST',body:JSON.stringify({programs,instructors:U.importPreview.instructors})});
    closeDlg(); if(q) U.quarter=q; await load(false);
    toast(`Imported ${r.created.length} program${r.created.length===1?'':'s'}${r.skipped.length?`, skipped ${r.skipped.length}`:''}${r.addedInstructors.length?`, added ${r.addedInstructors.length} instructors`:''}`);}catch(e){toast(e.message);}
}

  const rows=L.map((r,i)=>({r,i})).filter(({r})=>r.active!==false&&(!f||r.name.toLowerCase().includes(f)));
  const unset=L.filter(r=>r.active!==false&&!(r.quals||[]).length).length;
  let h=`<h2>Instructors</h2>${seg}<p class="sub">Tick the programs each instructor is approved to teach. Instructors see only those programs in the portal, and announcements and reminders cover only those programs. An instructor with nothing ticked is treated as approved for everything until you set their list. Anyone approved for at least one workshop also sees the Workshop Series.</p>
    ${unset?`<div class="notice"><strong>${unset} active instructor${unset>1?'s have':' has'} no approvals set</strong>, so ${unset>1?'they see':'they see'} every program and get every announcement and reminder.</div>`:''}
    <div class="bar"><input type="search" placeholder="Filter by name" value="${esc(U.filter)}" oninput="U.filter=this.value;clearTimeout(window._f);window._f=setTimeout(render,250)"><span class="grow"></span>
    <button class="btn" ${U.rosterDirty?'':'disabled'} onclick="saveRoster()">Save approvals</button></div>
    <div class="tbl-wrap"><table class="quals"><thead><tr><th rowspan="2" style="min-width:200px">Instructor</th>`;
  const groups=[...new Set(COURSES.map(c=>c[2]))];
  h+=groups.map(g=>`<th colspan="${COURSES.filter(c=>c[2]===g).length}" style="text-align:center">${esc(g)}</th>`).join('')+`<th rowspan="2"></th></tr><tr>`;
  h+=COURSES.map(([k,l])=>`<th class="qh" title="${esc(l)}"><img class="plogo sm" src="/images/${k}.svg" alt="" onerror="this.remove()"><div>${esc(l)}</div><button class="btn link" style="font-size:11px" onclick="qualCol('${k}')">All</button></th>`).join('')+`</tr></thead><tbody>`;
  h+=rows.map(({r,i})=>{const q=r.quals||[];return `<tr><td><strong>${esc(r.name)}</strong>${q.length?`<div class="facts">${q.length} program${q.length>1?'s':''}</div>`:'<div class="facts warn">Not set: sees everything</div>'}<div class="facts">Teaches: ${esc(DELIV[r.delivery]||'not stated')}</div></td>`+
    COURSES.map(([k,l])=>`<td style="text-align:center"><input type="checkbox" ${q.includes(k)?'checked':''} aria-label="${esc(r.name)}: ${esc(l)}" onchange="qualSet(${i},'${k}',this.checked)"></td>`).join('')+
    `<td style="white-space:nowrap"><button class="btn link" onclick="qualRow(${i},true)">All</button> <button class="btn link" onclick="qualRow(${i},false)">Clear</button></td></tr>`;}).join('');
  return h+`</tbody></table></div>`;
}
function qualSet(i,k,on){ const r=U.rosterDraft[i]; const q=new Set(r.quals||[]); on?q.add(k):q.delete(k); r.quals=COURSES.map(c=>c[0]).filter(x=>q.has(x)); U.rosterDirty=true; render(); }
function qualRow(i,all){ U.rosterDraft[i].quals=all?COURSES.map(c=>c[0]):[]; U.rosterDirty=true; render(); }
function qualCol(k){ const rows=U.rosterDraft.filter(r=>r.active!==false); const allOn=rows.every(r=>(r.quals||[]).includes(k));
  rows.forEach(r=>{ const q=new Set(r.quals||[]); allOn?q.delete(k):q.add(k); r.quals=COURSES.map(c=>c[0]).filter(x=>q.has(x)); }); U.rosterDirty=true; render(); }
function markRoster(){ if(!U.rosterDirty){U.rosterDirty=true;render();} }
function pasteRoster(){
  openDlg('Paste names and emails',`<p class="sub">Paste two columns from Excel: name (Last, First) and email. Names that match someone already listed get the email added; new names are added as new instructors.</p><textarea id="paste-r" rows="10" placeholder="Anderegg, Karen&#9;karen@example.gov"></textarea>`,
    `<button class="btn ghost" onclick="closeDlg()">Cancel</button><button class="btn" onclick="applyPaste()">Add to list</button>`);
}
function applyPaste(){
  const lines=document.getElementById('paste-r').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); let added=0,updated=0;
  for(const l of lines){
    const parts=l.includes('\t')?l.split('\t'):l.split(/,(?=[^,]*@)/); const name=(parts[0]||'').trim(), emails=(parts.slice(1).join(',')).split(/[,;\s]+/).map(e=>e.trim().toLowerCase()).filter(e=>e.includes('@'));
    if(!name) continue; const ex=U.rosterDraft.find(r=>r.name.toLowerCase()===name.toLowerCase());
    if(ex){ ex.emails=[...new Set([...(ex.emails||[]),...emails])]; updated++; } else { U.rosterDraft.push({name,emails,active:true,notes:''}); added++; }
  }
  U.rosterDirty=true; closeDlg(); render(); toast(`${updated} updated, ${added} added. Save instructors to keep them.`);
}
async function saveRoster(){
  try{ const r=await api('admin/roster',{method:'PUT',body:JSON.stringify({roster:U.rosterDraft})});
    D.roster=r.roster; U.rosterDraft=null; U.rosterDirty=false; render(); toast((U.rosterView==='quals'?'Approvals saved. ':'Instructors saved. ')+(U.rosterView!=='quals'&&r.sync&&r.sync.message?r.sync.message:''));}catch(e){toast(e.message);}
}
async function syncNow(){ try{ const r=await api('admin/sync-access',{method:'POST',body:'{}'}); toast(r.message||'Synced'); }catch(e){toast(e.message);} }

/* ================= Staff ================= */
function vStaff(){
  if(!U.staffDraft) U.staffDraft=clone(D.staff);
  const can=D.me.isAdmin;
  let h=`<h2>Staff</h2><p class="sub">Staff can use this dashboard and enter answers for instructors. Admins come from the ADMIN_EMAILS setting in Cloudflare and are always staff. ${can?'':'Only admins can change this list.'}</p>
    <div class="err"><strong>Note:</strong> When adding or removing staff, make and save your changes, then send an email to <a href="mailto:avance@clearhq.org?subject=Staff%20Addition%20or%20Removal%20Notification&body=Hello%2C%0D%0A%0D%0AI%20have%20made%20a%20change%20to%20the%20staff%20listed%20in%20the%20Instructor%20Portal%20that%20requires%20a%20change%20to%20the%20Cloudflare%20Zero%20Trust%20policy%20for%20this%20site.%20The%20staff%20information%20and%20status%20are%20included%20below.%0D%0A%0D%0AStaff%20Name%3A%20%0D%0AEmail%3A%20%0D%0AAdded%20or%20Removed%20from%20Portal%3A%20%0D%0A" style="color:#0144db;font-weight:bold;">avance@clearhq.org</a> notifying of the change. This allows the admin to make the appropriate changes to the site’s access permissions.</div>
    <div class="card"><h3>Admins</h3><p class="facts">${D.admins.map(esc).join(', ')||'None set'}</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody>${U.staffDraft.map((s,i)=>`<tr><td><input type="text" value="${esc(s.name)}" ${can?'':'disabled'} style="width:100%" onchange="U.staffDraft[${i}].name=this.value"></td><td><input type="email" value="${esc(s.email)}" ${can?'':'disabled'} style="width:100%" onchange="U.staffDraft[${i}].email=this.value"></td><td>${can?`<button class="btn link" onclick="U.staffDraft.splice(${i},1);render()">Remove</button>`:''}</td></tr>`).join('')}</tbody></table></div>
    ${can?`<div class="bar" style="margin-top:12px"><button class="btn ghost" onclick="U.staffDraft.push({name:'',email:''});render()">Add staff member</button><button class="btn" onclick="saveStaff()">Save staff</button></div>`:''}`;
  h+=calCard();
  return h;
}
async function saveStaff(){ try{ const r=await api('admin/staff',{method:'PUT',body:JSON.stringify({staff:U.staffDraft})}); D.staff=r.staff; U.staffDraft=null; render(); toast('Staff saved');}catch(e){toast(e.message);} }

/* ================= Activity ================= */
async function loadLog(){ try{ const r=await api('admin/log'); U.log=r.entries; if(U.tab==='log') render(); }catch(e){toast(e.message);} }
function vLog(){
  let h=`<h2>Activity</h2><p class="sub">The 300 most recent changes, newest first. Entries are kept for two years.</p><div class="bar"><button class="btn ghost" onclick="U.log=null;render()">Refresh</button></div>`;
  if(!U.log) return h+`<div class="loading">Loading…</div>`;
  if(!U.log.length) return h+`<div class="empty">No activity yet.</div>`;
  return h+`<div class="card">${U.log.map(e=>`<div class="log-row"><span class="t">${stamp(e.at)}</span><span>${esc(e.by)}</span><span><strong>${esc(e.action)}</strong>${e.detail?': '+esc(e.detail):''}</span></div>`).join('')}</div>`;
}

/* ---------- Dialog ---------- */
function openDlg(title,body,foot){ document.getElementById('dlg-title').textContent=title; document.getElementById('dlg-body').innerHTML=body; document.getElementById('dlg-foot').innerHTML=foot; document.getElementById('dlg').showModal(); }
function closeDlg(){ document.getElementById('dlg').close(); }

window.addEventListener('beforeunload',e=>{ if(U.assignDirty.size||U.rosterDirty){e.preventDefault();e.returnValue='';} });
load();
</script>
</body>
</html>
