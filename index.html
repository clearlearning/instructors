<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor Portal | CLEAR Learning</title>
<link rel="icon" type="image/png" href="https://assets-002.noviams.com/novi-file-uploads/clear/structure/clearlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#64092C; --burgundy-dk:#4A0620; --gold:#DDA838; --gold-lt:#F8EDD3;
  --charcoal:#484848; --ink:#2B2B2B; --blue:#084D78; --blue-lt:#E2EDF4;
  --bg:#F3F3F5; --surface:#FFFFFF; --line:#DEDCE0; --muted:#6E6B70;
  --avail:#1F6B3F; --avail-lt:#E3F1E8; --notavail:#5A5A5A; --na:#A9A6AB; --warn:#9A5B00;
  --radius-lg:10px; --radius-sm:6px;
  font-family:"Open Sans","Trebuchet MS",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* Header */
.top{background:var(--burgundy);color:#fff}
.top-in{max-width:1080px;margin:0 auto;padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.brand small{display:block;font-size:13px;opacity:.8;font-weight:600}
.brand h1{margin:2px 0 18px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.who{text-align:right;font-size:13px;padding-bottom:18px}
.who strong{display:block;font-size:15px}
.who a{color:#fff;opacity:.85}
.tabs{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:#fff;opacity:.75;padding:10px 16px 12px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--bg);color:var(--burgundy);opacity:1}
.tab .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:rgba(255,255,255,.18);font-size:12px;text-align:center}
.tab .n.hot{background:var(--gold);color:var(--burgundy-dk)}
.tab[aria-selected="true"] .n{background:var(--gold-lt);color:var(--burgundy)}

main{max-width:1080px;margin:0 auto;padding:24px 24px 100px}
.notice{background:var(--gold-lt);border-left:4px solid var(--gold);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px}
.err{background:#FBE9EC;border-left:4px solid var(--burgundy);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px}

/* Time zone bar */
.tzbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;border-left:4px solid var(--gold);background:var(--gold-lt)}
.tzbar.conv{background:var(--blue-lt);border-left-color:var(--blue)}
.tzbar .ic{font-size:20px;line-height:1}
.tzbar .txt{flex:1;min-width:240px}
.tzbar .txt strong{display:block}
.tzbar .txt span{font-size:13px;color:var(--charcoal)}
.tzbar select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;max-width:260px}
.et{color:var(--muted);font-size:12px;white-space:nowrap}
.shift{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-lt);padding:0 7px;border-radius:10px;margin-left:4px}

/* Delivery preference */
.prefs{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;background:#fff;border:1px solid var(--line)}
.prefs.unset{background:var(--gold-lt);border-color:var(--gold);border-left-width:4px}
.prefs .txt{flex:1;min-width:240px}
.prefs .txt strong{display:block}
.prefs .txt span{font-size:13px;color:var(--charcoal)}
/* Intro + filters */
.intro{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.intro p{margin:0;max-width:62ch;color:var(--charcoal)}
.meter{flex:1;min-width:220px}
.meter-label{font-size:13px;font-weight:600;color:var(--charcoal);margin-bottom:6px}
.meter-bar{height:8px;background:#E4E2E6;border-radius:4px;overflow:hidden}
.meter-bar span{display:block;height:100%;background:var(--avail);transition:width .3s}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.filters label{font-size:13px;color:var(--muted);font-weight:600}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#C9B4BC;box-shadow:0 4px 16px rgba(100,9,44,.08)}
.card-top{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:16px 18px 12px}
.card h2{margin:0 0 2px;font-size:17px;line-height:1.3;color:var(--burgundy)}
.card .cohort{font-size:13px;font-weight:600;color:var(--charcoal)}
.card .meta{font-size:13px;color:var(--muted)}
.card .slist{list-style:none;margin:0;padding:0 18px 12px 88px;font-size:13px}
.card.responded .slist{background:var(--avail-lt);padding-top:10px}
.card .slist .all{color:var(--blue);font-size:12px;font-weight:600}
.card .slist li{padding:2px 0;display:flex;gap:8px;flex-wrap:wrap}
.card .slist .dt{font-weight:600;min-width:92px}
.card .slist .more{color:var(--muted)}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;background:#FAF7F8;border-top:1px solid var(--line)}
.due{font-size:13px;font-weight:700;color:var(--burgundy)}
.due.soon{color:#9B1C1C}
.due.closed{color:var(--muted);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.badge.done{background:var(--avail-lt);color:var(--avail)}
.badge.part{background:var(--gold-lt);color:#7A5410}
.badge.need{background:#fff;color:var(--burgundy);border:1px solid var(--burgundy)}
.badge.none{background:#ECEAEE;color:var(--muted)}
.badge small{font-weight:600;opacity:.85}

/* Program track = coloured band across the top (NCIT burgundy, ELPR & SRA blue, ACRG, IRG & Board Chair gold).
   The program logo beside the title tells individual programs apart. */
.tr-ncit{--tc:var(--burgundy);--tt:var(--burgundy)}
.tr-blue{--tc:var(--blue);--tt:var(--blue)}
.tr-gold{--tc:var(--gold);--tt:var(--burgundy-dk)}
.card-top,.p-head,.a-head{border-top:6px solid var(--tc,#DEDCE0);background:#FAF7F8}
.card-top h2,.p-head h2,.a-head h2{color:var(--tt,var(--burgundy))!important}
.ttl{display:flex;gap:12px;align-items:center;min-width:0}
.plogo{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.plogo.lg{width:56px;height:56px;border-radius:10px}
.a-head .plogo{width:40px;height:40px}
.allattend{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-lt);padding:3px 10px;border-radius:12px;white-space:nowrap}
/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;font-weight:600;text-decoration:none}
.program{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.p-head{padding:18px 22px 14px;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid var(--line)}
.p-head h2{margin:0 0 2px;font-size:21px;line-height:1.3;color:var(--burgundy)}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--charcoal);margin-top:4px}
.p-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.deadline-box{padding:10px 22px;background:var(--gold-lt);font-size:14px;border-bottom:1px solid var(--line)}
.deadline-box.locked{background:#ECEAEE}
.desc{padding:14px 22px 0;color:var(--charcoal);max-width:75ch;white-space:pre-wrap}

/* Program files */
.f-prog>summary{cursor:pointer;list-style:none}
.f-prog>summary::-webkit-details-marker{display:none}
.f-prog>summary h2::before{content:"\25B8";display:inline-block;width:1.1em;color:var(--muted);transition:transform .15s}
.f-prog[open]>summary h2::before{transform:rotate(90deg)}
.f-prog:not([open])>summary{border-bottom:0}
.f-sum{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--charcoal)}
.f-group{padding:8px 22px;font-size:13px;font-weight:700;color:var(--charcoal);background:#FAF7F8;border-bottom:1px solid #EEECEF}
.f-name{display:flex;gap:12px;align-items:center;min-width:0}
.f-name .s-title{overflow-wrap:anywhere}
.f-ext{flex:none;width:46px;padding:4px 0;border-radius:4px;background:var(--charcoal);color:#fff;font-size:11px;font-weight:800;text-align:center;letter-spacing:.02em}
.f-ext.pptx,.f-ext.ppt,.f-ext.potx{background:#C43E1C}
.f-ext.pdf{background:var(--burgundy)}
.f-ext.docx,.f-ext.doc{background:#185ABD}
.f-ext.xlsx,.f-ext.xls{background:#107C41}
.f-act{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.f-dl{font-size:12px;color:var(--muted);white-space:nowrap}
.f-row.is-upd{background:#FFFBF1}
@media (max-width:720px){.f-act{justify-content:flex-start}.f-group{padding-left:16px}}
.s-inst{font-size:13px;margin-top:4px;color:var(--charcoal)}.s-inst a{color:var(--blue)}
.pf-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.pf-card h3{margin:0 0 10px;font-size:16px;color:var(--burgundy)}
.pf-grid{display:grid;gap:12px;margin-bottom:10px}.pf-grid.g1{grid-template-columns:1fr}.pf-grid.g2{grid-template-columns:1fr 1fr}.pf-grid.g3{grid-template-columns:1.4fr 1fr .8fr}.pf-grid.g4{grid-template-columns:1fr 1fr 1fr 110px}
.pf-f label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.pf-f .req{color:var(--burgundy)}
.pf-f input,.pf-f select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.pf-f input:focus,.pf-f select:focus{outline:3px solid var(--gold);outline-offset:1px}
.pf-shot{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pf-photo{width:130px;height:130px;border-radius:50%;overflow:hidden;background:var(--soft,#FAF7F8);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none}
.pf-photo img{width:100%;height:100%;object-fit:cover}
.pf-actions{position:sticky;bottom:0;background:var(--bg);display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:12px 0}
.rte-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:#FAF7F8;padding:5px 6px}
.rte-bar button{border:1px solid transparent;background:none;border-radius:4px;padding:3px 9px;font-size:13px;cursor:pointer}
.rte-bar button:hover{background:#fff;border-color:var(--line)}.rte-bar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rte{min-height:180px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:10px 12px;background:#fff;line-height:1.6}
.rte:focus{outline:3px solid var(--gold);outline-offset:1px}.rte:empty::before{content:attr(data-ph);color:var(--muted)}.rte p{margin:0 0 10px}
@media (max-width:700px){.pf-grid.g2,.pf-grid.g3,.pf-grid.g4{grid-template-columns:1fr}}
.btn{border:0;border-radius:var(--radius-sm);padding:9px 16px;font-weight:700;cursor:pointer;background:var(--burgundy);color:#fff;white-space:nowrap}
.btn:hover{background:var(--burgundy-dk)}
.btn:disabled{background:#CFCBD0;cursor:default}
.btn.ghost{background:#fff;color:var(--burgundy);border:1px solid var(--burgundy)}
.btn.ghost:hover{background:#FAF4F6}
.btn.small{padding:6px 12px;font-size:13px}
.btn.blue{background:var(--blue)}

.whole{display:flex;align-items:center;gap:18px;padding:14px 22px;background:#FAF7F8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.whole .lbl{font-weight:700;min-width:140px}
.whole .hint{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.sessions{list-style:none;margin:0;padding:0}
.session{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 22px;border-bottom:1px solid #EEECEF}
.session:last-child{border-bottom:0}
.s-title{font-weight:600}
.s-time{font-size:13px;color:var(--charcoal)}
.inherit{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}

/* Calendar tile */

/* Answer control */
.answer{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.answer button{border:0;background:#fff;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--charcoal);white-space:nowrap}
.answer button+button{border-left:1px solid var(--line)}
.answer button:hover:not(:disabled){background:#F5F3F6}
.answer button[aria-pressed="true"].A{background:var(--avail);color:#fff}
.answer button[aria-pressed="true"].N{background:var(--notavail);color:#fff}
.answer button[aria-pressed="true"].NA{background:var(--na);color:#fff}
.answer.inherited button[aria-pressed="true"]{opacity:.55}
.answer button:disabled{cursor:default}

.comment{padding:14px 22px 18px;border-top:1px solid var(--line)}
.comment label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.comment textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;resize:vertical}
.p-bottom{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 22px 18px;flex-wrap:wrap}
.saved-at{font-size:12px;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.savebar-in{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar-in span{flex:1;font-weight:600}
.savebar .btn.ghost{background:transparent;color:#fff;border-color:#fff}

/* Assignments */
.a-prog{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden}
.a-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:#FAF7F8}
.a-head h2{margin:0;font-size:17px;color:var(--burgundy)}
.assign{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 22px;border-bottom:1px solid #EEECEF}
.assign:last-child{border-bottom:0}
.role{font-size:12px;font-weight:700;color:var(--burgundy);background:var(--gold-lt);padding:2px 9px;border-radius:12px}
.zoom{font-size:13px;word-break:break-all}

.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius-lg);padding:36px;text-align:center;color:var(--charcoal)}
.empty h3{margin:0 0 6px;color:var(--burgundy)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.show{opacity:1}

@media (max-width:720px){
  .top-in{padding:18px 16px 0}.tabs{padding:0 8px}main{padding:16px 16px 110px}
  .brand h1{font-size:23px}.who{text-align:left}
  .cards{grid-template-columns:1fr}
  .card .slist{padding-left:18px}
  .p-head{grid-template-columns:56px 1fr;padding:16px}.p-actions{grid-column:1 / -1;align-items:flex-start}
  .session,.assign{grid-template-columns:1fr;padding:12px 16px}
  .session .ans-wrap,.assign .ans-wrap{grid-column:1 / -1}
  .inherit{text-align:left}
  .whole,.comment,.deadline-box{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><small>CLEAR Learning</small><h1 id="portal-name">Instructor Portal</h1></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="programs" aria-selected="true">Programs<span class="n" id="n-programs">0</span></button>
    <button class="tab" role="tab" data-tab="mine" aria-selected="false">My assignments<span class="n" id="n-mine">0</span></button>
    <button class="tab" role="tab" data-tab="files" aria-selected="false">Program files<span class="n" id="n-files" hidden>0</span></button>
    <button class="tab" role="tab" data-tab="reports" aria-selected="false">Evaluation reports<span class="n" id="n-reports">0</span></button>
    <button class="tab" role="tab" data-tab="profile" aria-selected="false">My profile</button>
  </nav>
</header>

<main id="main"><div class="loading">Loading your programs…</div></main>
<div class="savebar" id="savebar" hidden><div class="savebar-in"><span id="savebar-txt">You have unsaved answers</span><button class="btn ghost small" onclick="discard()">Discard</button><button class="btn small" style="background:var(--gold);color:var(--burgundy-dk)" onclick="save(S.view)">Save answers</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const S = { data:null, tab:'programs', view:null, drafts:{}, dirty:new Set(), quarter:'all', show:'all', tz:'America/New_York' };
const LABELS = {A:'Available',N:'Not available',NA:'N/A'};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LONGM = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ET = 'America/New_York';
const asId = new URLSearchParams(location.search).get('as');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseD(d){ const [y,m,dd] = String(d||'').split('-').map(Number); return y ? new Date(y, m-1, dd) : null; }
function fmtD(d, withYear=true){ const x=parseD(d); return x ? `${MONTHS[x.getMonth()]} ${x.getDate()}${withYear?', '+x.getFullYear():''}` : ''; }
function fmtDay(d){ const x=parseD(d); return x ? `${DAYS[x.getDay()]}, ${MONTHS[x.getMonth()]} ${x.getDate()}` : ''; }
function fmtLong(d){ const x=parseD(d); return x ? `${LONGM[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}` : ''; }
function fmtRange(a,b){ if(!a) return ''; if(!b||a===b) return fmtD(a); const A=parseD(a),B=parseD(b);
  return A.getFullYear()===B.getFullYear() ? `${fmtD(a,false)} – ${fmtD(b)}` : `${fmtD(a)} – ${fmtD(b)}`; }
function fmtStamp(iso){ if(!iso) return ''; return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3000); }

async function api(path, opts={}){
  const r = await fetch('/api/'+path, { ...opts, headers:{'Content-Type':'application/json'}, credentials:'same-origin' });
  let j={}; try{ j=await r.json(); }catch{ j={error:`The server returned ${r.status}. Reload the page and try again.`}; }
  if(!r.ok) throw new Error(j.error || `Request failed (${r.status}).`);
  return j;
}

/* ---------- Time zones ---------- */
const SRC_TZ = { ET:ET, EST:ET, EDT:ET, CT:'America/Chicago', MT:'America/Denver', PT:'America/Los_Angeles', AT:'America/Halifax', UTC:'UTC' };
const ZONES = [
  [ET,'Eastern Time'],['America/Chicago','Central Time'],['America/Denver','Mountain Time'],['America/Phoenix','Mountain Time (Arizona)'],
  ['America/Los_Angeles','Pacific Time'],['America/Anchorage','Alaska Time'],['Pacific/Honolulu','Hawaii Time'],['America/Halifax','Atlantic Time'],
  ['America/St_Johns','Newfoundland Time'],['America/Regina','Saskatchewan'],['America/Puerto_Rico','Puerto Rico'],['Europe/London','United Kingdom'],
  ['Europe/Dublin','Ireland'],['Australia/Sydney','Sydney'],['Pacific/Auckland','New Zealand']
];
const browserTz = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ET; }catch{ return ET; } })();
function zoneName(tz){ const z=ZONES.find(x=>x[0]===tz); return z ? z[1] : String(tz).split('/').pop().replace(/_/g,' '); }
function srcZone(p){ const k=String(p.timezone||'ET').trim(); return SRC_TZ[k.toUpperCase()] || (k.includes('/')?k:null); }
function isLocalTime(p){ return /person/i.test(p.format||'') || !srcZone(p); }
function clockMin(t){ const s=String(t||'').trim(); let m=s.match(/^(\d{1,2}):(\d{2})\s*([AP])\.?M\.?$/i);
  if(m) return (+m[1]%12+(/p/i.test(m[3])?12:0))*60+ +m[2]; m=s.match(/^(\d{1,2}):(\d{2})$/); return m? +m[1]*60+ +m[2] : null; }
const fmtCache={};
function partsIn(ms,tz){
  const f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'}));
  const p=f.formatToParts(new Date(ms)); const g=t=>(p.find(x=>x.type===t)||{}).value||'';
  return { date:`${g('year')}-${g('month')}-${g('day')}`, time:`${g('hour')}:${g('minute')} ${g('dayPeriod').toUpperCase()}`, abbr:g('timeZoneName') };
}
function offsetMin(ms,tz){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms));
  const g=t=>+(p.find(x=>x.type===t)||{}).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'),g('second'))-ms)/60000;
}
function instant(date, clock, tz){
  const mins=clockMin(clock); if(mins==null||!date) return null;
  const [y,m,d]=date.split('-').map(Number);
  const guess=Date.UTC(y,m-1,d,Math.floor(mins/60),mins%60);
  let t=guess-offsetMin(guess,tz)*60000; const o2=offsetMin(t,tz); t=guess-o2*60000; return t;
}
function converting(p){ return S.tz!==ET && !isLocalTime(p) && srcZone(p)!==S.tz; }
// Returns HTML for a session's time, converted when the viewer chose another zone.
function timeHtml(p, date, start, end, endDate){
  if(!start) return '';
  if(endDate && endDate!==date) return `${esc(start)} – ${esc(fmtDay(endDate))}, ${esc(end)} ${esc(p.timezone||'ET')}${isLocalTime(p)?' <span class="et">(local time)</span>':''}`;
  const src=`${esc(start)}${end?' – '+esc(end):''} ${esc(p.timezone||'ET')}`;
  if(isLocalTime(p)) return `${src}${/person/i.test(p.format||'')?' <span class="et">(local time)</span>':''}`;
  if(!converting(p)) return src;
  const zone=srcZone(p), a=instant(date,start,zone), b=end?instant(date,end,zone):null;
  if(a==null) return src;
  const A=partsIn(a,S.tz), B=b!=null?partsIn(b,S.tz):null;
  const shift=A.date!==date?`<span class="shift">${esc(fmtDay(A.date))} your time</span>`:'';
  return `${esc(A.time)}${B?' – '+esc(B.time):''} ${esc(A.abbr)}${shift} <span class="et">(${src})</span>`;
}
function tzOptions(){
  const seen=new Set(); let h='';
  const opt=(v,l)=>{ if(seen.has(v)) return ''; seen.add(v); return `<option value="${esc(v)}" ${S.tz===v?'selected':''}>${esc(l)}</option>`; };
  if(browserTz!==ET) h+=`<optgroup label="Your computer">${opt(browserTz,zoneName(browserTz)+' (detected)')}</optgroup>`;
  h+=`<optgroup label="Common">${ZONES.map(z=>opt(z[0],z[1])).join('')}</optgroup>`;
  if(Intl.supportedValuesOf){ try{ h+=`<optgroup label="All time zones">${Intl.supportedValuesOf('timeZone').map(z=>opt(z,z.replace(/_/g,' '))).join('')}</optgroup>`; }catch{} }
  if(!seen.has(S.tz)) h+=opt(S.tz,S.tz);
  return h;
}
function tzBar(){
  if(S.tz===ET) return `<div class="tzbar"><span class="ic" aria-hidden="true">🕒</span><div class="txt"><strong>All times are shown in Eastern Time (ET).</strong><span>That's the time zone CLEAR schedules in. In-person programs show the venue's local time.</span></div>
    <button class="btn blue small" onclick="setTz('${browserTz===ET?'':browserTz}')">${browserTz===ET?'Show times in another time zone':'Show times in my time zone ('+esc(zoneName(browserTz))+')'}</button></div>`;
  return `<div class="tzbar conv"><span class="ic" aria-hidden="true">🕒</span><div class="txt"><strong>Times are converted to ${esc(zoneName(S.tz))}.</strong><span>The original Eastern Time is in brackets after each time. Only the display changes; your answers are the same either way.</span></div>
    <label for="tzsel" class="et" style="font-weight:600">Time zone</label><select id="tzsel" onchange="setTz(this.value)">${tzOptions()}</select>
    <button class="btn ghost small" onclick="setTz('${ET}')">Back to Eastern Time</button></div>`;
}
function setTz(tz){
  if(!tz){ S.tz='America/Chicago'; }
  else S.tz=tz;
  try{ localStorage.setItem('ia_tz', S.tz); }catch{}
  rerender();
  if(!tz) setTimeout(()=>{ const s=document.getElementById('tzsel'); if(s) s.focus(); toast('Your computer is set to Eastern Time. Pick a time zone from the list.'); },50);
}

/* ---------- Load ---------- */
async function load(){
  try{
    try{ const t=localStorage.getItem('ia_tz'); if(t){ new Intl.DateTimeFormat('en-US',{timeZone:t}); S.tz=t; } }catch{}
    S.data = await api('portal' + (asId ? '?as='+encodeURIComponent(asId) : ''));
    S.expLoaded = false;
    S.drafts = {};
    for (const p of S.data.programs) resetDraft(p.id);
    S.dirty.clear();
    route();
    loadFiles();
  }catch(e){
    document.getElementById('main').innerHTML = `<div class="err"><strong>Couldn't load your page.</strong> ${esc(e.message)}</div>`;
  }
}
function resetDraft(pid){ const r=S.data.responses[pid]||{}; S.drafts[pid]={ program:r.program||'', sessions:{...(r.sessions||{})}, comment:r.comment||'' }; }

function eff(p, sid){ const d=S.drafts[p.id]; return (d.sessions[sid]) || d.program || ''; }
const answerable = p => p.sessions.filter(s=>!s.allInstructors);
const isIP = p => /person/i.test(p.format||'');
const trk = p => ['ncit','blue','gold'].includes(p.track) ? 'tr-'+p.track : '';
const CLEAR_LOGO='https://assets-002.noviams.com/novi-file-uploads/clear/structure/clearlogo.png';
// Large program logo in the header; falls back to the CLEAR logo so every header lines up.
const logoBig = p => `<img class="plogo lg" src="${esc(p.logo||CLEAR_LOGO)}" alt="" onerror="this.onerror=null;this.src='${CLEAR_LOGO}'">`;
const logoImg = p => p.logo ? `<img class="plogo" src="${esc(p.logo)}" alt="" onerror="this.remove()">` : '';
function units(p){ const a=answerable(p); return a.length ? a.map(s=>s.id) : [null]; }
function answeredDraft(p){ const d=S.drafts[p.id]; return units(p).filter(u => u ? eff(p,u) : d.program).length; }
function savedState(p){ // what's actually saved, for the badge
  const r=S.data.responses[p.id]; const n=units(p).length;
  if(!r) return {n, done:0, at:null};
  const done=units(p).filter(u=> u ? ((r.sessions||{})[u]||r.program) : r.program).length;
  return {n, done, at:r.updatedAt};
}
function badge(p){
  const s=savedState(p);
  if(s.done>=s.n && s.n) return `<span class="badge done">✓ Responded <small>${esc(fmtStamp(s.at).split(',')[0])}</small></span>`;
  if(s.done>0) return `<span class="badge part">${s.done} of ${s.n} answered</span>`;
  if(p.locked) return `<span class="badge none">No response</span>`;
  return `<span class="badge need">Needs your response</span>`;
}
function dueHtml(p){
  const today=S.data.today;
  if(p.status!=='open') return `<span class="due closed">Responses closed</span>`;
  if(p.pastDeadline) return `<span class="due closed">Responses closed ${fmtD(p.deadline,false)}</span>`;
  if(!p.deadline) return `<span class="due closed">Open for responses</span>`;
  const n=daysBetween(today,p.deadline);
  const left=n===0?'due today':n===1?'1 day left':`${n} days left`;
  return `<span class="due ${n<=7?'soon':''}">Respond by ${fmtD(p.deadline)} · ${left}</span>`;
}
function needsResponse(p){ const s=savedState(p); return !p.locked && s.done<s.n; }

/* ---------- Routing ---------- */
function route(){
  const m=location.hash.match(/^#\/program\/([\w-]+)/);
  const pid=m&&S.data.programs.some(p=>p.id===m[1])?m[1]:null;
  if(pid){ S.view=pid; S.tab='programs'; }
  else { S.view=null; if(['#/mine','#/reports','#/files','#/profile'].includes(location.hash)){ S.tab=location.hash.slice(2); history.replaceState(null,'','#/'); } }
  rerender(true);
}
window.addEventListener('hashchange',()=>{
  if(S.view && S.dirty.has(S.view) && !location.hash.includes(S.view)){
    if(!confirm('You have unsaved answers for this program. Leave without saving?')){ history.replaceState(null,'','#/program/'+S.view); return; }
    resetDraft(S.view); S.dirty.delete(S.view);
  }
  route();
});
function rerender(top){ const y=window.scrollY; render(); if(top) window.scrollTo(0,0); else window.scrollTo(0,y); }

function renderWho(){
  const d=S.data, me=d.me;
  const name = d.instructor ? d.instructor.name : (me.staffName || me.email);
  document.getElementById('who').innerHTML =
    `<strong>${esc(name)}</strong>${esc(me.email)}<br>` +
    (me.isStaff ? `<a href="/admin-dashboard">Staff dashboard</a> &nbsp; <a href="/api/files/log.csv" title="Download a spreadsheet of every program file download">File downloads</a> &nbsp; ` : '') +
    (isFac() ? '' : `<a href="/manuals/instructor-guide" target="_blank">Guide</a> &nbsp; `) + `<a href="/cdn-cgi/access/logout">Sign out</a>`;
}

function render(){
  renderWho();
  const d=S.data;
  const progs=d.programs;
  const np=progs.filter(needsResponse).length;
  const setN=(id,n,hot,title)=>{ const el=document.getElementById(id); el.textContent=n; el.classList.toggle('hot',hot); el.title=title; };
  setN('n-programs', np||progs.length, np>0, np?`${np} need your response`:`${progs.length} programs`);
  setN('n-mine', new Set(d.assignments.map(a=>a.programId+a.sessionId)).size, false, 'Confirmed assignments');
  const rp=d.reports||[], unread=rp.filter(r=>!r.viewedAt).length;
  setN('n-reports', unread||rp.length, unread>0, unread?`${unread} new report${unread>1?'s':''}`:`${rp.length} reports`);
  updFilesN();
  // Facilitators: "Facilitator Portal", "Available sessions" instead of Programs, and no evaluation reports.
  const portalName = isFac() ? 'Facilitator Portal' : 'Instructor Portal';
  const pn=document.getElementById('portal-name'); if (pn && pn.textContent!==portalName) pn.textContent=portalName;
  document.title = portalName + ' | CLEAR Learning';
  const fac=isFac(), pt=document.querySelector('.tab[data-tab="programs"]'), rt=document.querySelector('.tab[data-tab="reports"]');
  if (pt && pt.firstChild) pt.firstChild.textContent = fac ? 'Available sessions' : 'Programs';
  if (rt) rt.hidden = fac;
  if (fac && S.tab==='reports') S.tab='programs';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===S.tab));
  document.getElementById('savebar').hidden = !(S.view && S.dirty.has(S.view));

  const main=document.getElementById('main');
  let html='';
  if (d.viewingAs) html += `<div class="notice">You're previewing <strong>${esc(d.instructor ? d.instructor.name : 'an unknown instructor')}</strong>'s page as staff. Buttons are turned off here; assign people from the Selection tab of the dashboard.</div>`;
  if (!d.instructor && !d.viewingAs) {
    main.innerHTML = html + `<div class="empty"><h3>Your email isn't linked to an instructor record</h3><p>You're signed in as staff. Open the <a href="/admin-dashboard">staff dashboard</a>, or add ${esc(d.me.email)} to an instructor on the Instructors tab.</p></div>`;
    return;
  }
  if (S.view || !['files','profile'].includes(S.tab)) html += tzBar();
  if (S.view) html += renderDetail(d.programs.find(p=>p.id===S.view));
  else if (S.tab==='programs') html += (fac ? '' : prefCard()) + renderList(progs);
  else if (S.tab==='reports') html += renderReports();
  else if (S.tab==='profile') html += renderProfile();
  else if (S.tab==='files') html += renderFiles();
  else { html += renderMine(); loadExpenseStatus(); }
  main.innerHTML = html;

/* ---------- Role: instructor or contract facilitator ---------- */
const isFac=()=>!!(S.data&&S.data.role==='facilitator');
const VERB=()=>isFac()?'facilitate':'teach';

/* ---------- Delivery preference ---------- */
const DELIV=[['online','Online only'],['in-person','In person only'],['both','Both']];
function prefCard(){
  const d=S.data.instructor.delivery||'', ro=S.data.viewingAs;
  return `<div class="prefs ${d?'':'unset'}"><div class="txt"><strong>${d?'Formats you are available to teach':'Which formats are you available to teach?'}</strong><span>${d
    ?'You see, and receive emails about, programs in the formats you choose. You can change this at any time.'
    :'Choose one so CLEAR Learning contacts you only about programs you can teach. Until you choose, you will see every program.'}</span></div>
    <div class="answer" role="group" aria-label="Formats you are available to teach">${DELIV.map(([v,l])=>`<button type="button" class="A" aria-pressed="${d===v}" ${ro?'disabled':''} onclick="setDelivery('${v}')">${l}</button>`).join('')}</div></div>`;
}
async function setDelivery(v){
  if((S.data.instructor.delivery||'')===v) return;
  if(S.dirty.size && !confirm('You have unsaved answers. Change your formats and discard them?')) return;
  try{
    await api('profile',{method:'PUT',body:JSON.stringify({delivery:v})});
    await load();
    toast(v==='both'?'Saved. You will see online and in-person programs.':v==='online'?'Saved. You will see online programs only.':'Saved. You will see in-person programs only.');
  }catch(e){ toast(e.message); }
}

/* ---------- Card list ---------- */
function renderList(list){
  if (!list.length) return isFac() ? `<div class="empty"><h3>No sessions are available to facilitate yet</h3><p>CLEAR Learning staff will email you when sessions are open.</p></div>` : `<div class="empty"><h3>No programs are open for availability yet</h3><p>CLEAR Learning staff will email you when the next schedule is ready.</p></div>`;

  const quarters=[...new Set(list.map(p=>p.quarter).filter(Boolean))];
  let shown=list.filter(p => S.quarter==='all' || p.quarter===S.quarter);
  if (S.show==='need') shown=shown.filter(needsResponse);
  else if (S.show==='done') shown=shown.filter(p=>!needsResponse(p));
  shown.sort((a,b)=> (a.locked-b.locked) || String(a.deadline||'9').localeCompare(String(b.deadline||'9')) || String(a.startDate).localeCompare(String(b.startDate)));

  const openList=list.filter(p=>!p.locked);
  const total=openList.reduce((n,p)=>n+units(p).length,0), done=openList.reduce((n,p)=>n+savedState(p).done,0);
  const need=list.filter(needsResponse).length;
  let h='';
  h += `<div class="intro"><p>Open a program to mark the sessions or modules you are able to ${VERB()}, and those you are not. You may return and change your answers at any time before the response date.</p>
    <div class="meter"><div class="meter-label">${done} of ${total} open sessions answered${need?`; ${need} program${need>1?'s':''} still need${need>1?'':'s'} a response`:''}</div><div class="meter-bar"><span style="width:${total?Math.round(done/total*100):0}%"></span></div></div></div>`;
  h += `<div class="filters">`;
  if (quarters.length>1) h += `<label for="fq">Quarter</label><select id="fq" onchange="S.quarter=this.value;rerender()"><option value="all">All</option>${quarters.map(q=>`<option ${S.quarter===q?'selected':''}>${esc(q)}</option>`).join('')}</select>`;
  h += `<label for="fs">Show</label><select id="fs" onchange="S.show=this.value;rerender()">
    <option value="all" ${S.show==='all'?'selected':''}>Everything (${list.length})</option>
    <option value="need" ${S.show==='need'?'selected':''}>Needs my response (${need})</option>
    <option value="done" ${S.show==='done'?'selected':''}>Responded or closed (${list.length-need})</option></select></div>`;
  if (!shown.length) h += S.show==='need'
    ? `<div class="empty"><h3>You're all caught up</h3><p>You've answered everything that's open. Switch Show to Everything to review or change your answers.</p></div>`
    : `<div class="empty"><h3>Nothing to show</h3><p>Try a different filter.</p></div>`;
  else h += `<div class="cards">${shown.map(card).join('')}</div>`;
  return h;
}
function card(p){
  const all=p.sessions, n=answerable(p).length, MAX=7, unit=isIP(p)?'module':'live session';
  const meta=[p.format, p.location && p.location!=='Virtual' ? p.location : '', n?`${n} ${unit}${n>1?'s':''}`:'Staffed as a whole program'].filter(Boolean).join(' · ');
  let sl='';
  if (all.length){
    sl=`<ul class="slist">${all.slice(0,all.length>MAX+1?MAX:all.length).map(s=>`<li><span class="dt">${esc(fmtDay(s.date))}</span><span>${isIP(p)?esc(s.title)+' · ':''}${timeHtml(p,s.date,s.start,s.end,s.endDate)||'<span class="et">Time to be set</span>'}${s.allInstructors?' <span class="all">All cohort instructors attend</span>':''}</span></li>`).join('')}${all.length>MAX+1?`<li class="more">+ ${all.length-MAX} more</li>`:''}</ul>`;
  }
  const s0=savedState(p), done=s0.n&&s0.done>=s0.n;
  return `<a class="card${done?' responded':''}" href="#/program/${p.id}">
    <div class="card-top ${trk(p)}">${logoBig(p)}<div class="ttl"><div><h2>${esc(p.title)}</h2>${p.cohort?`<div class="cohort">${esc(p.cohort)}</div>`:''}<div class="meta">${esc(fmtRange(p.startDate,p.endDate))}${meta?' · '+esc(meta):''}</div></div></div></div>
    ${sl}
    <div class="card-foot">${dueHtml(p)}${badge(p)}</div></a>`;
}

/* ---------- Detail ---------- */
function answerCtl(p, sid, value, inherited){
  const labels = LABELS;
  const locked = p.locked || S.data.viewingAs;
  const which = sid===null ? 'whole program' : 'this session';
  return `<div class="answer ${inherited?'inherited':''}" role="group" aria-label="Your answer for ${which}">` +
    Object.entries(labels).map(([v,l]) =>
      `<button type="button" class="${v}" aria-pressed="${value===v}" ${locked?'disabled':''} onclick="setVal('${p.id}',${sid===null?'null':`'${sid}'`},'${v}')">${l}</button>`).join('') +
    `</div>`;
}
function renderDetail(p){
  const d=S.drafts[p.id], r=S.data.responses[p.id], dirty=S.dirty.has(p.id), unit=isIP(p)?'module':'session';
  const facts=[fmtRange(p.startDate,p.endDate), p.format, p.location && p.location!=='Virtual' ? p.location : ''].filter(Boolean);
  const editable=!p.locked && !S.data.viewingAs;
  let h=`<a class="back" href="#/">← All programs</a>
  <section class="program" id="prog-${p.id}">
    <div class="p-head ${trk(p)}">${logoBig(p)}<div class="ttl"><div>
      <h2>${esc(p.title)}</h2>${p.cohort?`<div style="font-weight:600;color:var(--charcoal)">${esc(p.cohort)}</div>`:''}
      <div class="facts">${facts.map(f=>`<span>${esc(f)}</span>`).join('')}</div>
    </div></div>
    <div class="p-actions">${badge(p)}${dirty?'<span class="badge part">Unsaved changes</span>':''}</div></div>`;
  if (p.locked) h+=`<div class="deadline-box locked">${p.pastDeadline?`The response date (${fmtLong(p.deadline)}) has passed, so answers are locked.`:'Responses for this program are closed.'} To change something, email <a href="mailto:clearlearning@clearhq.org">clearlearning@clearhq.org</a>.</div>`;
  else if (p.deadline) h+=`<div class="deadline-box"><strong>Respond by ${fmtLong(p.deadline)}</strong> (11:59 PM Eastern). ${r?'You can change your answers until then.':'You can save now and change your answers any time until then.'}</div>`;
  if (p.description) h+=`<div class="desc">${esc(p.description)}</div>`;

  if (!answerable(p).length){
    h+=`<div class="whole"><span class="lbl">Entire program</span>${answerCtl(p,null,d.program,false)}<span class="hint">This program is staffed as a whole. Note any days you can't cover in the comments.</span></div>`;
  } else {
    h+=`<div class="whole"><span class="lbl">Whole program</span>${answerCtl(p,null,d.program,false)}<span class="hint">Sets every ${unit} below in one click. Change any single ${unit} to override it.</span></div><ol class="sessions">`;
    for (const s of p.sessions){
      const t=timeHtml(p,s.date,s.start,s.end,s.endDate);
      if (s.allInstructors){
        h+=`<li class="session"><div><div class="s-title">${esc(s.title)}</div><div class="s-time">${esc(fmtDay(s.date))}${t?', '+t:''}</div></div>
          <div class="ans-wrap"><span class="allattend">All instructors assigned to this cohort attend</span></div></li>`;
        continue;
      }
      const own=d.sessions[s.id]||'', v=own||d.program||'', inh=!own && !!d.program;
      h+=`<li class="session"><div><div class="s-title">${esc(s.title)}</div><div class="s-time">${esc(fmtDay(s.date))}${t?', '+t:''}</div></div>
        <div class="ans-wrap">${answerCtl(p,s.id,v,inh)}${inh?'<div class="inherit">From whole program</div>':''}</div></li>`;
    }
    h+=`</ol>`;
  }
  h+=`<div class="comment"><label for="c-${p.id}">Comments for staff</label>
    <textarea id="c-${p.id}" ${editable?'':'disabled'} placeholder="Conditions or notes, for example “first half only” or a ${unit} you would especially like to lead" oninput="setComment('${p.id}',this.value)">${esc(d.comment)}</textarea></div>
    <div class="p-bottom"><span class="saved-at">${r && r.updatedAt ? 'Last saved '+fmtStamp(r.updatedAt) : 'Not answered yet'}</span>
    ${editable?`<button class="btn" ${dirty?'':'disabled'} onclick="save('${p.id}')">${r?'Save changes':'Save answers'}</button>`:''}</div></section>`;
  return h;
}

/* ---------- Assignments ---------- */
function renderMine(){
  const a=S.data.assignments;
  if(!a.length) return `<div class="empty"><h3>No confirmed assignments yet</h3><p>Once staff confirm you to ${VERB()} a session or program, it shows up here with a calendar file.</p></div>`;
  const groups=[]; for(const x of a){ let g=groups.find(g=>g.pid===x.programId); if(!g){ g={pid:x.programId,items:[]}; groups.push(g); } g.items.push(x); }

function fileUpdated(f){ const s=((S.files||{}).seen||{})[f.id]; return !!(s && s.mod && Date.parse(f.modified)>Date.parse(s.mod)); }
function updFilesN(){

function rteLink(){

  const range=sel.getRangeAt(0); let url=prompt('Link address (https://)','https://'); if(!url) return; url=url.trim();
  if(!/^(https:\/\/|mailto:)/i.test(url)){ toast('Links must start with https://'); return; }

function rteHtml(el){
  const out=[]; let run='';
  const flush=()=>{ if(run.replace(/<br>|&nbsp;|\s/g,'')) out.push('<p>'+run+'</p>'); run=''; };
  el.childNodes.forEach(n=>{
    if(n.nodeType===1&&/^(P|DIV|UL|OL|H[1-6]|BLOCKQUOTE)$/.test(n.tagName)){ flush(); out.push(n.outerHTML); }
    else if(n.nodeType===1&&n.tagName==='BR'){ if(run) run+='<br>'; else flush(); }
    else run+=n.nodeType===3?esc(n.textContent):n.outerHTML;
  });
  flush(); return out.join('');
}

// Resize in the browser (longest side 1,600 px, high-quality JPEG) before uploading.
async function uploadHeadshot(input){
  const f=input.files[0]; if(!f) return; const msg=document.getElementById('pf-shot-msg');
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ msg.textContent='Choose a JPEG, PNG or WebP image.'; return; }
  msg.textContent='Preparing your photo…';
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('That file couldn\u2019t be read as an image.')); i.src=URL.createObjectURL(f); });
    const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*scale); cv.height=Math.round(img.naturalHeight*scale);
    const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
    const dataUrl=cv.toDataURL('image/jpeg',0.88);
    msg.textContent='Uploading…';
    const r=await api('my-profile/headshot',{method:'PUT',body:JSON.stringify({dataUrl})});
    S.prof.profile.headshotAt=r.headshotAt; rerender(); toast('Photo saved');
  }catch(e){ msg.textContent=e.message; }
}

  return `<div class="intro"><p>Each report summarizes participant ratings and comments from your module evaluations. Reports open in a new tab; to keep a copy, use your browser's print option and choose Save as PDF.</p></div>
    <div class="a-prog">${rp.map(r=>`<div class="assign"><div><div class="s-title">${esc(r.title)}</div><div class="s-time">Published ${esc(fmtStamp(r.createdAt).split(',')[0])}${r.viewedAt?'':' <span class="badge need" style="margin-left:6px">New</span>'}</div></div>
      <div class="ans-wrap"><a class="btn small" href="${esc(r.url)}" target="_blank" rel="noopener" style="text-decoration:none" onclick="setTimeout(load,1500)">View report</a></div></div>`).join('')}</div>`;
}
async function getIcs(pid){
  try{
    const r=await fetch('/api/my-ics/'+encodeURIComponent(pid)+(asId?'?as='+encodeURIComponent(asId):''),{credentials:'same-origin'});
    if(!r.ok){ let j={}; try{ j=await r.json(); }catch{} throw new Error(j.error||`Couldn't get the calendar file (${r.status}).`); }
    const blob=await r.blob(); const cd=r.headers.get('Content-Disposition')||''; const m=cd.match(/filename="([^"]+)"/);
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=m?m[1]:'CLEAR-assignment.ics'; a.click();
    toast('Calendar file downloaded. Open it to add the sessions to your calendar.');
  }catch(e){ toast(e.message); }
}

/* ---------- Edits ---------- */
function setVal(pid, sid, v){
  const d=S.drafts[pid];
  if (sid===null){
    d.program = d.program===v ? '' : v;
  } else {
    const own = d.sessions[sid] || '';
    if ((own || d.program) === v) {
      if (own) delete d.sessions[sid];        // clicking your own answer again clears it
      else return;                            // inherited answer: change it on the whole-program row
    } else if (v === d.program) delete d.sessions[sid];
    else d.sessions[sid] = v;
  }
  S.dirty.add(pid);
  rerender();
}
function setComment(pid, v){
  S.drafts[pid].comment=v;
  if(!S.dirty.has(pid)){ S.dirty.add(pid); rerender();
    const t=document.getElementById('c-'+pid); t.focus(); t.setSelectionRange(v.length,v.length); }
}
function discard(){ if(!S.view) return; resetDraft(S.view); S.dirty.delete(S.view); rerender(); toast('Changes discarded'); }
async function save(pid){
  if(!pid) return;
  const d=S.drafts[pid], p=S.data.programs.find(x=>x.id===pid);
  const had=!!S.data.responses[pid];
  try{
    const res=await api('response/'+encodeURIComponent(pid),{method:'PUT',body:JSON.stringify(d)});
    S.data.responses[pid]=res.response;
    S.dirty.delete(pid);
    rerender();
    const left=units(p).length-answeredDraft(p);
    toast((had?'Changes saved':'Answers saved')+(left?`. ${left} ${isIP(p)?'module':'session'}${left>1?'s are':' is'} still unanswered.`:p.deadline?`. You can change them until ${fmtD(p.deadline)}.`:'.'));
  }catch(e){ toast(e.message); }
}
window.addEventListener('beforeunload', e => { if (S.dirty.size){ e.preventDefault(); e.returnValue=''; } });

document.getElementById('tabs').addEventListener('click', e => {
  const t=e.target.closest('.tab'); if(!t) return;
  if(S.view && S.dirty.has(S.view) && !confirm('You have unsaved answers for this program. Leave without saving?')) return;
  if(S.view){ resetDraft(S.view); S.dirty.delete(S.view); }
  S.tab=t.dataset.tab; S.view=null;
  if(location.hash.startsWith('#/program/')) history.replaceState(null,'','#/');
  rerender(true);
});
load();
</script>
